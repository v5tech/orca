name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Tag must look like v1.2.3"
              exit 1
              ;;
          esac

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp orca.sh orca_test.sh README.md LICENSE dist/
          cd dist
          tar -czf "orca-${TAG}.tar.gz" orca.sh orca_test.sh README.md LICENSE
          sha256sum "orca-${TAG}.tar.gz" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/orca-${TAG}.tar.gz" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "orca.sh $TAG"
