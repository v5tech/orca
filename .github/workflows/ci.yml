name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -s sh orca.sh orca_test.sh

  posix:
    name: POSIX compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Syntax checks
        run: |
          dash -n orca.sh
          dash -n orca_test.sh
          bash --posix -n orca.sh
          bash --posix -n orca_test.sh
      - name: Run tests with dash as /bin/sh
        run: |
          shim="$RUNNER_TEMP/shim"
          mkdir -p "$shim"
          ln -s "$(command -v dash)" "$shim/sh"
          PATH="$shim:$PATH" sh orca_test.sh

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests
        run: sh orca_test.sh

  containers:
    name: Container (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            setup: ":"
          - image: ubuntu:24.04
            setup: ":"
          - image: quay.io/centos/centos:stream9
            setup: "if ! command -v awk >/dev/null || ! command -v find >/dev/null; then if command -v dnf >/dev/null; then dnf install -y gawk findutils >/dev/null; else microdnf install -y gawk findutils >/dev/null; fi; fi"
          - image: registry.access.redhat.com/ubi9/ubi:latest
            setup: "if ! command -v awk >/dev/null || ! command -v find >/dev/null; then if command -v dnf >/dev/null; then dnf install -y gawk findutils >/dev/null; else microdnf install -y gawk findutils >/dev/null; fi; fi"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$IMAGE" \
            sh -c "$SETUP && sh orca_test.sh"

  summary:
    name: Summary
    if: always()
    needs: [lint, posix, native, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        env:
          LINT: ${{ needs.lint.result }}
          POSIX: ${{ needs.posix.result }}
          NATIVE: ${{ needs.native.result }}
          CONTAINERS: ${{ needs.containers.result }}
        run: |
          {
            echo '## CI summary'
            echo ''
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "| lint | $LINT |"
            echo "| posix | $POSIX |"
            echo "| native | $NATIVE |"
            echo "| containers | $CONTAINERS |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$LINT" != "success" ] || [ "$POSIX" != "success" ] || \
             [ "$NATIVE" != "success" ] || [ "$CONTAINERS" != "success" ]; then
            exit 1
          fi
